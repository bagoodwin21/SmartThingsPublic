name: Deploy CYRA Wellness Homepage

on:
  push:
    branches: [claude/cyra-wellness-homepage-15yptr, master]
    paths: [cyra-wellness-homepage/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cyra-wellness-homepage/package-lock.json

      - name: Install dependencies
        working-directory: cyra-wellness-homepage
        run: npm ci

      - name: Build
        working-directory: cyra-wellness-homepage
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: cyra-wellness-homepage/dist
          commit_message: "Deploy CYRA Wellness homepage"
